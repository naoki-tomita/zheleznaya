name: Release
# v* のタグを push すると、テスト → ビルド → npm へのステージ公開 → GitHub Release 作成まで行う。
# リリース手順: `npm version patch|minor|major` (package.json の更新・コミット・タグ作成) → `git push --follow-tags`
#   → npmjs.com でステージされた版を承認すると公開される (2FA が必要)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release を作る
  id-token: write # npm の Trusted Publishing (トークンなしで公開) と provenance に使う

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - run: yarn --frozen-lockfile
        name: Resolve dependency

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の version $version が一致しません"
            exit 1
          fi

      - run: yarn typecheck && yarn test
        name: Test

      # dist/ はリポジトリにもコミットされているので、消してから作り直す (古い構成のファイルを公開しないため)
      - run: rm -rf dist && yarn build
        name: Build

      # Trusted Publishing と npm stage は新しい npm CLI が必要 (Node 24 同梱の npm は古いことがある)
      - run: npm install -g npm@latest
        name: Update npm

      # npmjs.com の zheleznaya の Trusted Publisher に、このリポジトリと release.yml を
      # 「npm stage publish」の権限で登録しておくこと。GitHub Actions の OIDC で認証するので NPM_TOKEN は使わない。
      # ここではステージに置くだけで、公開はメンテナーが承認したとき (npmjs.com か `npm stage approve <stage-id>`)
      - run: npm stage publish --provenance --access public
        name: Stage to npmjs

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
