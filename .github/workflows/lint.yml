name: run test
on: push
jobs:
  run-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install packages
        run: yarn
      - name: Type check
        run: yarn typecheck
      - name: Run Test
        run: yarn test
